[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ambient-recorder"
version = "0.1.0"
description = "Local-first ambient meeting recorder: mic + system audio capture sessions"
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.115.0",
    "uvicorn[standard]~=0.34.0",
    "pydantic~=2.10.0",
    "PyAudioWPatch~=0.2.12",
    "soxr~=0.5.0",
    "numpy~=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3",
    "httpx~=0.28.0",
    "ruff~=0.9.0",
]
# Constitution gate (c): installing this extra pulls ~1 GB of CUDA/cuDNN
# wheels; model weights (~1.5 GB) are fetched separately by scripts/fetch_models.py.
transcription = [
    "faster-whisper~=1.1.0",
    "ctranslate2~=4.5.0",
    # ctranslate2 4.5's CUDA build needs the 12.4-line wheels; the unpinned
    # 12.9 wheels load but fail at first matmul (CUBLAS_STATUS_INVALID_VALUE)
    "nvidia-cublas-cu12==12.4.5.8",
    "nvidia-cudnn-cu12==9.1.0.70",
    "nvidia-cuda-nvrtc-cu12==12.4.127",
    # ctranslate2 4.5 still imports pkg_resources, removed in setuptools 81+
    "setuptools<81",
    # faster-whisper 1.1.1's wheel metadata omits these runtime imports
    "requests",
    "huggingface_hub",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ambient_recorder"]

[tool.pytest.ini_options]
testpaths = ["tests/contract", "tests/unit", "tests/integration"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
